# Example: Lidarr + lidarr-meta-proxy on the same network.
# The proxy points Lidarr at itself on startup (LIDARR_URL + LIDARR_CONFIG_XML);
# without those variables use scripts/set-metadata-source.sh instead.
services:
  lidarr-meta:
    # Published image; to build from source instead, uncomment `build` (and run `docker compose build`).
    image: ghcr.io/nemolo/lidarr-meta-proxy:latest
    # build: .
    container_name: lidarr-meta
    restart: unless-stopped
    environment:
      # URL under which Lidarr reaches the proxy (image URLs are built from it).
      PUBLIC_URL: http://lidarr-meta:5001
      MB_USER_AGENT: "lidarr-meta-proxy/0.2 ( you@example.com )"
      ITUNES_COUNTRY: it
      # Namespace/seed of synthetic UUIDs; set it before the first start and never change it.
      # UUID_NAMESPACE: my-instance-seed
      # Optional secondary source:
      # SPOTIFY_CLIENT_ID: ...
      # SPOTIFY_CLIENT_SECRET: ...
      # Set Lidarr's MetadataSource to PUBLIC_URL at startup, reading the API key from config.xml.
      LIDARR_URL: http://lidarr:8686
      LIDARR_CONFIG_XML: /lidarr/config.xml
      RUST_LOG: info,lidarr_meta_proxy=debug
    volumes:
      - lidarr-meta-data:/data
      # Lidarr's config folder, read-only (mount the folder: config.xml may not exist yet).
      - lidarr-config:/lidarr:ro
    networks: [media]

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Rome
    volumes:
      - lidarr-config:/config
      - ./music:/music
      - ./downloads:/downloads
    ports:
      - "8686:8686"
    depends_on:
      lidarr-meta:
        condition: service_healthy
    networks: [media]

volumes:
  lidarr-meta-data:
  lidarr-config:

networks:
  media:
