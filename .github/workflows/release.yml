name: Release

# Publishes a GitHub Release (changelog generated with git-cliff from the
# Conventional Commits since the previous tag, Linux binaries + checksums) and a
# multi-arch Docker image on ghcr.io. Only commits on main can be released.
#
# Start it by pushing a tag:      git tag v0.2.0 && git push origin v0.2.0
# or from Actions → Release → Run workflow (the tag is then created by the release).
# The version must match `version` in Cargo.toml.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.2.0). Must match Cargo.toml."
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      image: ${{ steps.v.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        name: Resolve and validate version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a semantic version"; exit 1
          fi
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::version $version does not match Cargo.toml ($cargo_version): bump Cargo.toml first"; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" != "push" ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::tag v$version already exists"; exit 1
          fi
          # Releases are cut from main only.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main: release only commits merged into main"; exit 1
          fi
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "version=$version"
            echo "prerelease=$pre"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

  # Same checks as on main / pull requests: lint, tests, Docker build.
  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: [prepare, checks]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-26.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    # Built in Debian bookworm (same image as the Dockerfile) rather than on the
    # runner's Ubuntu 26.04, so the binaries only need glibc >= 2.36.
    container: rust:1.99.1-bookworm
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          name="lidarr-meta-proxy-${{ needs.prepare.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/release/lidarr-meta-proxy README.md docker-compose.yml "dist/$name/"
          cp -r scripts "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  docker:
    needs: [prepare, checks]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prepare.outputs.image }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: Build and push by digest
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Export digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    needs: [prepare, docker]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prepare.outputs.image }}
          # Pre-releases get only their exact version tag.
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}
      - name: Create multi-arch manifest
        shell: bash
        working-directory: /tmp/digests
        run: |
          # Word splitting is intended: one "-t tag" pair and one image reference per word.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ needs.prepare.outputs.image }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect ${{ needs.prepare.outputs.image }}:${{ steps.meta.outputs.version }}

  release:
    needs: [prepare, binaries, docker-manifest]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Generate changelog
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          # Previous release reachable from this commit; stable releases skip
          # pre-releases so their notes cover everything since the last stable one.
          exclude=(--exclude "v$VERSION")
          if [ "$PRERELEASE" = "false" ]; then exclude+=(--exclude "*-*"); fi
          prev=$(git describe --tags --abbrev=0 --match "v[0-9]*" "${exclude[@]}" HEAD 2>/dev/null || true)
          range=()
          if [ -n "$prev" ]; then range=("$prev..HEAD"); fi
          echo "changes since: ${prev:-first commit}"
          git cliff --tag "v$VERSION" --strip all "${range[@]}" > changelog.md
          cat changelog.md
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          {
            cat changelog.md
            echo
          } > notes.md
          cat >> notes.md <<EOF
          ## Docker

          \`\`\`sh
          docker pull ${IMAGE}:${VERSION}
          \`\`\`

          Multi-arch image (linux/amd64, linux/arm64). See the README for configuration and for
          pointing Lidarr at the proxy.

          ## Binaries

          Linux x86_64 and aarch64 (glibc >= 2.36, e.g. Debian 12+, Ubuntu 22.10+), with SHA-256 checksums.
          EOF
          args=(--repo "$GITHUB_REPOSITORY" --title "v$VERSION" --notes-file notes.md --target "$GITHUB_SHA")
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "v$VERSION" dist/* "${args[@]}"
