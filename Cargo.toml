[package]
name = "lidarr-meta-proxy"
version = "0.3.2"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
deunicode = "1.6.2"
flate2 = "1.1.11"
futures = "0.3.34"
governor = "0.10.4"
hex = "0.4.3"
imagesize = "0.15.0"
log = "0.4.35"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "stream", "query", "form", "system-proxy", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v5", "v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = "0.5.3"
wiremock = "0.6.5"
